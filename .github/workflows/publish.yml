name: Publish EPUB chapters to Inkstone

on:
  workflow_dispatch:
    inputs:
      start_chapter:
        description: 'EPUB chapter to start from (0 = resume automatically)'
        required: false
        default: '0'
      end_chapter:
        description: 'EPUB chapter to stop at (0 = end of book)'
        required: false
        default: '0'
      max_chapters:
        description: 'Chapters to publish in this run'
        required: false
        default: '200'
      delay_seconds:
        description: 'Pause between chapters'
        required: false
        default: '10'
      dry_run:
        description: 'Unpack the EPUB and print a preview without uploading'
        type: boolean
        required: false
        default: false

# Public repo, so these runner minutes are unmetered rather than capped at 2000/month.
permissions:
  contents: write
  actions: write

env:
  VAULT_BRANCH: vault-state

concurrency:
  group: inkstone-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "inkstone-uploader"
          git config user.email "actions@github.com"
          chmod +x scripts/seal-and-push.sh

      - name: Restore vault progress
        run: |
          # Progress lives on its own branch, which only this workflow ever writes, so the
          # checkout can never collide with a code push. Seed from main the first time.
          git fetch --depth 1 origin "+refs/heads/${{ env.VAULT_BRANCH }}:refs/remotes/origin/${{ env.VAULT_BRANCH }}" 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/${{ env.VAULT_BRANCH }}" >/dev/null; then
            echo "restoring vault from ${{ env.VAULT_BRANCH }}"
            git restore --source="origin/${{ env.VAULT_BRANCH }}" vault
          else
            echo "no ${{ env.VAULT_BRANCH }} branch yet, using the vault committed on main"
          fi

      - name: Unpack vault
        env:
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
        run: node src/vault.mjs unpack

      - name: Migrate the legacy session filename
        run: |
          # Sessions used to live in one storage-state.json. They are now one file per Inkstone
          # account, so a second account can carry more novels past the per-account book cap.
          if [ -f work/session/storage-state.json ] && [ ! -f work/session/main.json ]; then
            mv work/session/storage-state.json work/session/main.json
            echo "migrated the session to work/session/main.json"
          fi

      - name: Publish
        id: publish
        env:
          # The progress hook seals and pushes mid-run, so it needs the passphrase here too.
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
          VAULT_DIR: ${{ github.workspace }}/vault
          WORK_DIR: ${{ github.workspace }}/work
          BOOKS_CONFIG: ${{ github.workspace }}/books.json
          SESSION_PATH: ${{ github.workspace }}/work/session/storage-state.json
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          START_CHAPTER: ${{ inputs.start_chapter }}
          END_CHAPTER: ${{ inputs.end_chapter }}
          MAX_CHAPTERS: ${{ inputs.max_chapters }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PROGRESS_HOOK: ${{ github.workspace }}/scripts/seal-and-push.sh
        run: node src/publish.mjs

      - name: Seal and push
        if: always() && inputs.dry_run == false
        env:
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
        run: |
          ./scripts/seal-and-push.sh "chore: upload progress"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Inkstone upload"
            echo ""
            echo "- book: ${{ steps.publish.outputs.book || 'none left' }}"
            echo "- published this run: ${{ steps.publish.outputs.published || 0 }}"
            echo "- next EPUB chapter: ${{ steps.publish.outputs.next_chapter || 'unknown' }}"
            echo "- still to go: ${{ steps.publish.outputs.remaining || 0 }}"
            echo "- finished: ${{ steps.publish.outputs.finished || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkstone-debug-${{ github.run_number }}
          path: artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Hand off to the next run
        if: success() && inputs.dry_run == false && steps.publish.outputs.finished != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "still ${{ steps.publish.outputs.remaining }} chapters left, dispatching the next run"
          gh workflow run publish.yml \
            --ref "${{ github.ref_name }}" \
            -f start_chapter="0" \
            -f end_chapter="${{ inputs.end_chapter }}" \
            -f max_chapters="${{ inputs.max_chapters }}" \
            -f delay_seconds="${{ inputs.delay_seconds }}" \
            -f dry_run="false"
