name: Publish EPUB chapters to Inkstone

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Inkstone book id (leave empty to use the secret INKSTONE_BOOK_ID)'
        required: false
        default: ''
      start_chapter:
        description: 'EPUB chapter to start from (0 = resume automatically)'
        required: false
        default: '0'
      end_chapter:
        description: 'EPUB chapter to stop at (0 = end of book)'
        required: false
        default: '0'
      max_chapters:
        description: 'Chapters to publish in this run'
        required: false
        default: '50'
      delay_seconds:
        description: 'Pause between chapters'
        required: false
        default: '45'
      dry_run:
        description: 'Unpack the EPUB and print a preview without uploading'
        type: boolean
        required: false
        default: false

# Public repo, so these runner minutes are unmetered rather than capped at 2000/month.
permissions:
  contents: write
  actions: write

concurrency:
  group: inkstone-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "inkstone-uploader"
          git config user.email "actions@github.com"
          chmod +x scripts/seal-and-push.sh

      - name: Unpack vault
        env:
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
        run: node src/vault.mjs unpack

      - name: Publish
        id: publish
        env:
          ASSETS_DIR: ${{ github.workspace }}/work
          EPUB_PATH: ${{ github.workspace }}/work/book.epub
          STATE_PATH: ${{ github.workspace }}/work/state/state.json
          SESSION_PATH: ${{ github.workspace }}/work/session/storage-state.json
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          INKSTONE_BOOK_ID: ${{ inputs.book_id || secrets.INKSTONE_BOOK_ID }}
          INKSTONE_EMAIL: ${{ secrets.INKSTONE_EMAIL }}
          INKSTONE_PASSWORD: ${{ secrets.INKSTONE_PASSWORD }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          END_CHAPTER: ${{ inputs.end_chapter }}
          MAX_CHAPTERS: ${{ inputs.max_chapters }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PROGRESS_HOOK: ${{ github.workspace }}/scripts/seal-and-push.sh
        run: node src/publish.mjs

      - name: Seal and push
        if: always() && inputs.dry_run == false
        env:
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
        run: |
          ./scripts/seal-and-push.sh "chore: upload progress"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Inkstone upload"
            echo ""
            echo "- published this run: ${{ steps.publish.outputs.published || 0 }}"
            echo "- next EPUB chapter: ${{ steps.publish.outputs.next_chapter || 'unknown' }}"
            echo "- still to go: ${{ steps.publish.outputs.remaining || 0 }}"
            echo "- finished: ${{ steps.publish.outputs.finished || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inkstone-debug-${{ github.run_number }}
          path: artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Hand off to the next run
        if: success() && inputs.dry_run == false && steps.publish.outputs.finished != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "still ${{ steps.publish.outputs.remaining }} chapters left, dispatching the next run"
          gh workflow run publish.yml \
            --ref "${{ github.ref_name }}" \
            -f book_id="${{ inputs.book_id }}" \
            -f start_chapter=0 \
            -f end_chapter=${{ inputs.end_chapter }} \
            -f max_chapters=${{ inputs.max_chapters }} \
            -f delay_seconds=${{ inputs.delay_seconds }}"
