name: Probe the create-novel form

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Which stored session to use: main or second'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: inkstone-probe-create-form
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore vault
        env:
          VAULT_BRANCH: vault-state
        run: |
          git fetch --depth 1 origin "+refs/heads/${{ env.VAULT_BRANCH }}:refs/remotes/origin/${{ env.VAULT_BRANCH }}" 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/${{ env.VAULT_BRANCH }}" >/dev/null; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git restore --source="origin/${{ env.VAULT_BRANCH }}" -- "$path"
            done < <(git ls-tree -r --name-only "origin/${{ env.VAULT_BRANCH }}" -- vault)
          fi

      - name: Unpack vault
        env:
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
        run: |
          node src/vault.mjs unpack
          # Older vaults only have the pre-per-account filename; give the default account its
          # expected name so a probe does not fail with a confusing "not signed in".
          if [ -f work/session/storage-state.json ] && [ ! -f work/session/main.json ]; then
            mv work/session/storage-state.json work/session/main.json
            echo "migrated the legacy session filename to main.json"
          fi
          if [ ! -f "work/session/${{ inputs.account }}.json" ]; then
            echo "::error::no session stored for account '${{ inputs.account }}'. Import it first:"
            echo "  node src/import-cookies.mjs <cookies.json> --account ${{ inputs.account }}"
            exit 1
          fi

      - name: Probe the form
        env:
          VAULT_PASSPHRASE: ${{ secrets.VAULT_PASSPHRASE }}
          SESSION_PATH: ${{ github.workspace }}/work/session/${{ inputs.account }}.json
          ACCOUNT_NAME: ${{ inputs.account }}
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: node src/probe-create-form.mjs | tee probe-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Create-novel form probe"
            echo ""
            echo '```'
            cat probe-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the form screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-novel-form
          path: artifacts
          retention-days: 7
          if-no-files-found: ignore